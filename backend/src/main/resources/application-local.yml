# Local development profile.
#
# It no longer overrides the scheduler. The old override re-checked every URL
# once a minute "so the timeline fills in quickly while testing", which is
# exactly what gave pages with any dynamic markup (GitHub, Google) a
# CONTENT_CHANGED row in their timeline every minute. Local now follows the
# application default, 15 minutes; export CHECK_INTERVAL_SECONDS to shorten it
# while testing. Activate with SPRING_PROFILES_ACTIVE=local (or
# --spring.profiles.active=local).
app:
  check:
    default-interval-seconds: ${CHECK_INTERVAL_SECONDS:900}